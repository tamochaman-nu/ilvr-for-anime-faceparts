# 256x256 のアニメ顔 DDPM (MPUNetModel, 128ch): ddpm/anime-face256-mp128-ema_0.9995_100000.pt
# (../3dgs-for-styletransfer/cycle-diffusion-for-anime-face/ckpts/ddpm/anime-mp-100000-128-ema09995.pt の
# ハードリンク)。学習時の train.cfg は保存されていないので、値は次の資料から写した。
#   [A] ~/guided-diffusion の docker-compose.yml (コミット 644c591) の x-train-params。
#       TRAIN_LOGDIR: /app/logs/anime-mp128 (64 行目)
#   [B] ~/guided-diffusion-ilvr-eye/cfgs/mp128.cfg (コミット 5bb6a5c)。1 行目「logs/anime-mp128 の設定」
# NOISE_SCHEDULE は、cycle-diffusion-for-anime-face 側の推論用の設定 (guided_diffusion_mp128_face256_cosine.yml の
# 33 行目) では cosine だったが、[A] [B] と、チェックポイントの作者の確認 (2026-11-20) に従い cosine_shift4 とする。
# 書式は read_cfg (guided_diffusion/ilvr_eye.py) を参照。推論に使うのはモデルと拡散過程の値だけ。
IMAGE_SIZE="256"            # [A] 3 行目, [B] 5 行目
NUM_CHANNELS="128"          # [A] 4 行目, [B] 6 行目
NUM_RES_BLOCKS="2"          # [A] 5 行目, [B] 7 行目
NUM_HEADS="4"               # [A] 6 行目, [B] 8 行目
NUM_HEAD_CHANNELS="64"      # [A] 7 行目, [B] 9 行目
CHANNEL_MULT="1,1,2,2,4,4"  # [A] 9 行目, [B] 11 行目は空 -> 学習フォークの script_util.py の create_model の 256 の既定値 (173-174 行目)
ATTENTION_RESOLUTIONS="32,16,8"  # [A] 8 行目, [B] 10 行目
DROPOUT="0"                 # [A] 10 行目, [B] 12 行目 (推論は eval モードなので結果に影響しない)
LEARN_SIGMA="True"          # [A] 11 行目, [B] 13 行目 (出力は 6 チャネル: 平均 3 + 分散 3)
CLASS_COND="False"          # [B] 14 行目
ARCH="mp"                   # [A] 33 行目, [B] 23 行目
MP_CLIP_ACT="256"           # [A] 34 行目, [B] 24 行目
ATTR_COND="False"           # [B] 28 行目
DIFFUSION_STEPS="1000"      # [B] 34 行目
NOISE_SCHEDULE="cosine_shift4"  # [A] 18 行目, [B] 35 行目
